<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image Vectorizer (CloudConvert)</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--accent:#0a84ff;--border:#d2d2d7}
@media (prefers-color-scheme: dark){
  :root{--bg:#111;--card:#1c1c1e;--text:#f5f5f7;--muted:#98989d;--accent:#0a84ff;--border:#3a3a3c}
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);padding:14px}
.wrap{max-width:900px;margin:0 auto}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
button:disabled{opacity:.45;cursor:default}
input[type=password],textarea{font:inherit;width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text)}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:12px;min-height:90px}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
.drop{border:2px dashed var(--border);border-radius:12px;padding:22px;text-align:center}
.drop.on{border-color:var(--accent)}
.compare{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:700px){.compare{grid-template-columns:1fr 1fr}}
.box{background:repeating-conic-gradient(#8882 0 25%,transparent 0 50%) 0 0/16px 16px;border-radius:8px;min-height:200px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:6px}
.box img{max-width:100%;max-height:420px;display:block}
.muted{color:var(--muted);font-size:13px}
.warn{color:#ff9f0a;font-size:13px}
.err{color:#ff453a;font-size:13px}
.title{font-size:13px;color:var(--muted);margin:0 0 6px}
pre{white-space:pre-wrap;word-break:break-word;font-size:11px;max-height:260px;overflow:auto;background:var(--bg);border-radius:8px;padding:8px;margin:8px 0 0}
details summary{cursor:pointer;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Image Vectorizer (CloudConvert)</h1>

  <div class="card">
    <div class="drop" id="drop">
      <input type="file" id="file" accept="image/png,image/jpeg,image/webp" hidden>
      <button class="ghost" id="pick">Pilih gambar</button>
      <div class="muted" style="margin-top:8px">atau seret &amp; lepas PNG / JPG / WEBP ke sini</div>
    </div>
  </div>

  <div class="card">
    <details>
      <summary>Pengaturan</summary>
      <div style="margin-top:10px">
        <label for="code">Kode akses (kalau ACCESS_CODE diatur di Vercel)</label>
        <input type="password" id="code" autocomplete="off">
      </div>
      <div style="margin-top:10px">
        <label for="opts">Opsi tracing CloudConvert (JSON, boleh kosong). Lihat nama opsi yang valid lewat tombol "Lihat opsi".</label>
        <textarea id="opts" placeholder='{}' spellcheck="false"></textarea>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="ghost" id="showOpts">Lihat opsi</button>
      </div>
      <pre id="optsOut" hidden></pre>
    </details>
    <div class="row" style="margin-top:14px">
      <button id="go" disabled>Vektorisasi</button>
      <button id="dl" class="ghost" disabled>Download SVG</button>
    </div>
    <div id="status" class="muted" style="margin-top:10px">Pilih gambar dulu.</div>
  </div>

  <div class="compare">
    <div>
      <p class="title">Original</p>
      <div class="box" id="orig"><span class="muted">Belum ada gambar</span></div>
    </div>
    <div>
      <p class="title">Vector (SVG)</p>
      <div class="box" id="vec"><span class="muted">Belum divektorisasi</span></div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let srcImg = null, svgText = '', baseName = 'hasil', busy = false, vecUrl = '';
const MAX_DIM = 2000;
const MAX_B64 = 4000000; // batas body Vercel 4,5 MB

function setStatus(t, cls){ const s = $('status'); s.textContent = t; s.className = cls || 'muted'; }
function lsGet(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

$('code').value = lsGet('vec_code');
$('opts').value = lsGet('vec_opts');
$('code').addEventListener('input', ()=> lsSet('vec_code', $('code').value));
$('opts').addEventListener('input', ()=> lsSet('vec_opts', $('opts').value));

$('pick').addEventListener('click', ()=> $('file').click());
$('file').addEventListener('change', e=>{ if(e.target.files[0]) loadFile(e.target.files[0]); });
const drop = $('drop');
drop.addEventListener('dragover', e=>{ e.preventDefault(); drop.classList.add('on'); });
drop.addEventListener('dragleave', ()=> drop.classList.remove('on'));
drop.addEventListener('drop', e=>{
  e.preventDefault(); drop.classList.remove('on');
  if(e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});

function loadFile(f){
  if(!f.type.startsWith('image/')){ setStatus('File bukan gambar.', 'err'); return; }
  baseName = f.name.replace(/\.[^.]+$/, '') || 'hasil';
  const url = URL.createObjectURL(f);
  const img = new Image();
  img.onload = ()=>{
    srcImg = img;
    $('orig').innerHTML = '';
    const p = new Image(); p.src = url; $('orig').appendChild(p);
    $('vec').innerHTML = '<span class="muted">Belum divektorisasi</span>';
    svgText = ''; $('dl').disabled = true; $('go').disabled = false;
    setStatus(`Gambar ${img.width}×${img.height}px siap. Tekan Vektorisasi.`);
  };
  img.onerror = ()=> setStatus('Gagal membuka gambar.', 'err');
  img.src = url;
}

// Kecilkan gambar dan ubah ke PNG base64 yang muat di batas body Vercel
function toBase64Png(img){
  let scale = Math.min(1, MAX_DIM / Math.max(img.width, img.height));
  for(let i = 0; i < 8; i++){
    const w = Math.max(1, Math.round(img.width * scale));
    const h = Math.max(1, Math.round(img.height * scale));
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, 0, 0, w, h);
    const b64 = cv.toDataURL('image/png').split(',')[1];
    if(b64.length <= MAX_B64) return {b64, w, h};
    scale *= 0.8;
  }
  throw new Error('Gambar terlalu besar untuk dikirim.');
}

function headers(){
  const h = {'Content-Type': 'application/json'};
  const c = $('code').value.trim();
  if(c) h['x-access-code'] = c;
  return h;
}

async function callJson(url, init){
  const r = await fetch(url, init);
  const t = await r.text();
  let j; try { j = JSON.parse(t); } catch(e){ j = null; }
  if(!r.ok) throw new Error((j && j.error) || ('HTTP ' + r.status + ' ' + t.slice(0, 120)));
  return j;
}

$('go').addEventListener('click', async ()=>{
  if(!srcImg || busy) return;
  let options = {};
  const raw = $('opts').value.trim();
  if(raw){
    try { options = JSON.parse(raw); } catch(e){ setStatus('Opsi bukan JSON yang valid.', 'err'); return; }
  }
  busy = true; $('go').disabled = true; $('dl').disabled = true;
  try {
    setStatus('Menyiapkan gambar…');
    const {b64, w, h} = toBase64Png(srcImg);
    setStatus(`Mengirim ke CloudConvert (${w}×${h}px)… ini bisa memakan waktu beberapa detik.`);
    const j = await callJson('/api/convert', {method:'POST', headers: headers(), body: JSON.stringify({image: b64, options})});
    svgText = j.svg;
    if(!/<svg[\s>]/i.test(svgText)) throw new Error('Hasil bukan SVG yang valid.');

    // tampilkan lewat <img> supaya script di dalam SVG tidak bisa jalan
    if(vecUrl) URL.revokeObjectURL(vecUrl);
    vecUrl = URL.createObjectURL(new Blob([svgText], {type:'image/svg+xml'}));
    $('vec').innerHTML = '';
    const im = new Image(); im.src = vecUrl; $('vec').appendChild(im);

    const doc = new DOMParser().parseFromString(svgText, 'image/svg+xml');
    const paths = doc.querySelectorAll('path').length;
    const groups = doc.querySelectorAll('g').length;
    const hasRaster = /<image[\s>]/i.test(svgText);
    const mb = new Blob([svgText]).size / 1048576;
    const size = mb >= 1 ? mb.toFixed(2) + ' MB' : (mb * 1024).toFixed(0) + ' KB';
    let msg = `${groups} grup · ${paths} path · ${size} (batas 2 MB)`;
    let cls = 'muted';
    if(hasRaster){ msg += ' — peringatan: SVG berisi gambar raster, bukan vektor murni.'; cls = 'warn'; }
    else if(mb > 2){ msg += ' — melebihi 2 MB. Coba opsi penyederhanaan path / hapus bintik.'; cls = 'warn'; }
    else msg += ' — siap diunduh.';
    setStatus(msg, cls);
    $('dl').disabled = false;
  } catch(e){
    console.error(e);
    setStatus('Gagal: ' + e.message, 'err');
  }
  busy = false; $('go').disabled = false;
});

$('showOpts').addEventListener('click', async ()=>{
  const out = $('optsOut');
  out.hidden = false; out.textContent = 'Memuat…';
  try {
    const j = await callJson('/api/options', {headers: headers()});
    out.textContent = JSON.stringify(j, null, 2);
  } catch(e){ out.textContent = 'Gagal: ' + e.message; }
});

$('dl').addEventListener('click', ()=>{
  if(!svgText) return;
  const url = URL.createObjectURL(new Blob([svgText], {type:'image/svg+xml'}));
  const a = document.createElement('a');
  a.href = url; a.download = baseName + '.svg';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 2000);
});
</script>
</body>
</html>
